[package]
name = "zu-manox"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Same pin as `zu-app`'s (`native/Cargo.toml`): one core for the app, so the
# generated hosts, the runner and both crates share one engine API.
nsh-core = { git = "https://github.com/longbridge/nsh.git", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time", "macros"] }
# The SessionRuntime decorator below implements the kernel's async trait.
async-trait = "0.1"

# The real manox AHP host (M1: the T0 stub is gone). One tag for the whole
# crate family — the kernel's crates share one version — pinned like
# manox-app pins it (`tag = "vX.Y.Z"`, the Cargo.lock records the rev).
manox-ahp = { git = "https://github.com/dspo/manox.git", tag = "v0.12.1" }
manox-ahp-runtime = { git = "https://github.com/dspo/manox.git", tag = "v0.12.1" }
manox-session-core = { git = "https://github.com/dspo/manox.git", tag = "v0.12.1" }
manox-agent = { git = "https://github.com/dspo/manox.git", tag = "v0.12.1" }
manox-harness = { git = "https://github.com/dspo/manox.git", tag = "v0.12.1" }
tracing = "0.1"
# The wire message type our Sink/Source impls name. `=1.0.0` is the same pin
# the manox workspace carries, so both resolve to one copy.
ahp-types = "=1.0.0"
# The kernel's Py tool (RustPython) needs one malachite-bigint: `pymath`
# declares `version = "0"` and unifies onto 0.14 unless held back — the exact
# single-copy resolution the manox workspace lock carries (0.12.0 only).
# NOTE: the generated workspace lock (app/.nsh/rust/Cargo.lock, untracked) is
# re-resolved whenever tracked .nsh files change, and a fresh resolve gives
# pymath the newest `0`-range malachite-bigint (0.14), which does not
# compile against it. Recovery, in app/.nsh/rust:
#   cargo update -p malachite-bigint@0.14.0 --precise 0.12.0
malachite-bigint = "=0.12.0"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
