# Zu — CNB 云原生构建（手动远程门禁 + 云原生开发环境）。
#
# 自动 CI 已关闭（docs/decisions.md Q119）：合并门禁在本地，`bun run gate`
# 全绿才开 PR；每次 push 的廉价检查由 `.githooks/pre-push`
# （`bun run gate:fast`）承担。原因：产品只发 macOS，Linux 节点真正独有的
# 只有 manox 的 libssl/libffi 链接与 glibc/rustc 差异，而同一套 stage 原本
# 在 PR 与 main push 上重复跑两遍；本地 gate 反过来覆盖了 Linux 跑不了的
# 终端 AppKit 用例与 pi-harness 的 darwin 编译（见 script/ci.ts 的 gate）。
#
# 远程复核入口：`git push origin HEAD:ci/remote`，只有这个分支触发下面的
# 门禁流水线；main push 只在 NPC 镜像输入变化时重建镜像（ifModify）。
# `$: vscode` 是云原生开发，`$` 下的 NPC 事件流水线不受影响。
#
# 以下环境约束仍适用于 ci/remote 与手动构建。单条流水线串行执行，任一 stage
# 失败即红。除 toolchain 外，每个 stage 的 script 都是一行
# `bun script/ci.ts <stage>`：逻辑在 script/ci.ts（与 script/tasks.ts 共享
# nsh 发现/版本校验/spawn 纪律，见 script/lib/toolchain.ts），本地 macOS
# 跑同一入口即可复现。toolchain 是唯一的 inline shell 例外：它负责安装 bun
# 本身（apt/curl/rustup component），在它跑完之前没有 bun 可以执行任何 TS；
# 仓库不放独立的 shell 脚本文件。
#
# 不含 bundle：`bun script/tasks.ts bundle` 依赖 macOS（AppKit 宿主、bun
# --target=bun-darwin-arm64、codesign），CNB SAAS 只有 Linux 节点；
# 打包冒烟留在 macOS 本地（README「Run it」）。若日后接入自托管 mac
# runner（runner.namespace + runner.tags），再把 bundle 加为独立 pipeline。
#
# 环境要点（都是实测出来的约束，改镜像/依赖前先读）：
# - nsh CLI 用预编译发行版（linux x86_64 only → runner 固定 amd64），
#   NSH_VERSION 与 native/Cargo.toml 的 nsh git pin（f4d68f7 = v0.5.0）严格一致。
# - nsh 的 Linux 运行时按 pinned checkout 源码构建，无条件依赖 GTK4/GStreamer
#   开发包（nsh-platform-linux 的 target.'cfg(target_os = "linux")' 段），
#   因此镜像用 rust:slim-trixie（glibc 2.41 ≥ 发行版要求的 2.39，GTK 4.18 ≥ 4.14；
#   bookworm 的 glibc 2.36 / GTK 4.8 都不够）并 apt 安装两组 -dev。
# - rust:slim-trixie 不带 curl CLI（apt 里只有 libcurl3t64-gnutls 这类库），
#   而 nsh 与 bun 的安装脚本都硬依赖 curl，必须显式装 curl + ca-certificates。
# - 流水线脚本由 dash 执行：没有 pipefail，`curl … | sh` 里 curl 失败会被 sh 的
#   退出码 0 掩盖，故障漂到下一句才炸成 127 command not found。下载一律先落盘再执行。
# - 卷只能挂在「镜像里本来是空」的路径上：copy-on-write 卷会直接盖住挂载路径下
#   镜像自带的文件（只有 `data` 类型才会先把容器内容复制进卷）。rust 镜像用
#   rustup 安装（--no-modify-path），cargo/rustc 的 shim 就在 $CARGO_HOME/bin，
#   所以挂 CARGO_HOME 根 /usr/local/cargo 会把 cargo 一起盖掉，直到某个 stage
#   才报「error run cargo metadata (is Rust installed?)」；改成只挂两个缓存子目录。
# - nsh 安装脚本会整体替换安装目录（mv $dir $dir.old → mv 新目录 过去），而挂载点
#   不能 rename：直接把 NSH_INSTALL_DIR 指向卷根 /root/.nsh 会死在
#   `mv: cannot move '/root/.nsh' to '/root/.nsh.old': Device or resource busy`。
#   所以按版本装到卷内的子目录 dist/$NSH_VERSION：rename 落在普通子目录上，runtime 与
#   component 同目录（nsh 把 component 装在 CLI 旁边），缓存仍在卷里。
# - ZU_SKIP_LIVE=1 是 README「完整门禁」的口径：跳过 live 模型/LSP，以及唯一
#   要真 dist/pi-acp 的探针（acp-load-probe）。其余 harness 触点在测试里走
#   stub 替身（fixtures/acp-stub-agent.ts，由 bun spawn），CI 不构建
#   pi-harness（其编译目标 pin 了 bun-darwin-arm64）。
# - 镜像的 Rust 是 `rustup-init --profile minimal`，按发布 channel manifest
#   `minimal = [rustc, cargo, rust-std, rust-mingw]` —— **不含 clippy/rustfmt**。
#   rust lint stage 依赖先 `rustup component add clippy rustfmt`（~7MB）。
#   组件落在 $RUSTUP_HOME=/usr/local/rustup，那里全是镜像自带内容，**不能挂卷**
#   （同一类盖掉问题），所以这 7MB 每构建重下，这是代价而不是漏配。
# - manox 在 Linux 上的依赖图需要两个系统包（native 不需要，所以本地 macOS 跑
#   不出来）：`libssl-dev`（openssl-sys 未开 vendored，走 pkg-config 找系统
#   OpenSSL；路径 reqwest → hyper-tls → native-tls）与 `libffi-dev`（libffi-sys 的
#   `system` feature 被点亮 → `cargo:rustc-link-lib=dylib=ffi`；`cargo check` 不链接
#   看不出，到 `cargo test` 才死）。其余 -sys 已逐个核过不需要系统包：
#   libsqlite3-sys 走 bundled、zstd-sys/onig_sys 走 cc 编 vendored 源码、
#   xz-sys 是纯 Rust（无 build script）、rav1e 的 `asm` feature 未开（不需 nasm）。
# - `native` 与 `native/manox` 是**两个独立 workspace**（manox 自带 [workspace]
#   与 Cargo.lock；native 的 `cargo metadata` 只返 members: [zu-app]）。任何
#   workspace 级的 cargo 门禁都必须两处各跑一遍，写成一处会静默漏掉一半代码。
# - 生成出来的 app 级 workspace（`app/.nsh/rust`，整目录被 ignore）会**新鲜解析**
#   自己的 Cargo.lock，而 pymath 0.2.0 把 `malachite-bigint` 写成 `version = "0"`：
#   新鲜解析给 pymath 挑最新的 0.14，rustpython-* 却钉在 0.12，两份副本共存时
#   rustpython-stdlib 编译失败（E0277/E0308）。两份已提交的 lock 都已被手动收成
#   单副本，所以 `cargo check`/`clippy` 看不出来；只有走 nsh 的构建会炸。
#   native/manox/Cargo.toml 里记了这个坑与恢复命令，`build (nsh check)` 把它自动化。
#   这份 lock 不可预先提交：成员包名带路径哈希、nsh-* 版本跟着 CLI 版本走，
#   只能在生成之后就地修。
#
# 缓存：docker.volumes 默认 copy-on-write，流水线成功后合并回共享卷；
# push 与 PR 事件共用同一组卷（PR 并发写安全，由 COW 解决）。

.check-and-test: &check-and-test
  name: check-and-test
  runner:
    tags: cnb:arch:amd64
  docker:
    image: rust:slim-trixie
    volumes:
      # 以下路径在镜像/新鲜 clone 里本来都不存在，不会被误当成镜像内容盖掉（见文件头）。
      - /usr/local/cargo/registry   # crates.io 索引与下载缓存（CARGO_HOME 的子目录）
      - /usr/local/cargo/git        # nsh 的 git 依赖 checkout
      - /root/.nsh                  # nsh 发行版（dist/<version>/bin + runtime/component）~160MB
      - /root/.bun/install/cache    # bun 全局安装缓存
      - ./app/target              # nsh 生成 workspace 的 target（不挂则两遍从头编译）
      - ./native/target             # native 工作区 target
      - /root/.cache/zu-ghostty     # libghostty-vt 的 zig/tarball/静态库缓存（native/ghostty/build.rs）
      - /root/.cache/steer-conformance  # esctest2 tarball 缓存（conformance stage）
  env:
    NSH_VERSION: v0.5.0
    ZU_SKIP_LIVE: "1"
    ZU_GHOSTTY_CACHE: /root/.cache/zu-ghostty
    DEBIAN_FRONTEND: noninteractive
    PATH: /usr/local/cargo/bin:/root/.local/bin:/root/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  stages:
    # ── toolchain：apt 系统依赖 + nsh/bun + rust lint 组件。整个 .cnb.yml 里
    #    唯一的 inline shell stage：它安装 bun 本身，在其跑完之前没有 bun 可以
    #    执行 script/ci.ts（其余 stage 一律 `bun script/ci.ts <stage>`）。──
    - name: toolchain
      script: |
        set -eu
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          git pkg-config clang unzip curl ca-certificates xz-utils \
          vim htop \
          libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libssl-dev libffi-dev \
          python3-minimal
        # 先落盘再执行（dash 无 pipefail，见文件头「环境要点」）。
        curl -fsSL https://nsh.dev/install.sh -o /tmp/nsh-install.sh
        # 装到卷内的版本子目录：挂载点不能被安装脚本 rename。
        nsh_home="$HOME/.nsh/dist/${NSH_VERSION:?NSH_VERSION must pin the nsh release}"
        if [ -x "$nsh_home/bin/nsh" ]; then
          echo "nsh cache hit: $("$nsh_home/bin/nsh" --version)"
        else
          NSH_INSTALL_DIR="$nsh_home" sh /tmp/nsh-install.sh
        fi
        # /root/.local/bin 不是卷，每次构建都是新容器：目录与链接都得自己补
        # （缓存命中时安装脚本没跑，镜像里这个目录也不存在，ln -sf 不建父目录）。
        mkdir -p "$HOME/.local/bin"
        ln -sf "$nsh_home/bin/nsh" "$HOME/.local/bin/nsh"
        curl -fsSL https://bun.sh/install -o /tmp/bun-install.sh
        bash /tmp/bun-install.sh        # → ~/.bun/bin/bun
        # 镜像是 --profile minimal，clippy/rustfmt 要自己装（见文件头「环境要点」）。
        rustup component add clippy rustfmt
        # 六个工具在本 stage 一次性验完：cargo 不在这里检查的话，它被卷盖住只会
        # 表现为两个 stage 之后的「is Rust installed?」，名字完全指向错地方。
        nsh --version && bun --version \
          && cargo --version && rustc --version \
          && cargo clippy --version && cargo fmt --version

    # ── lint：sheet-module 依赖门禁（core/shell 不许 import modules 等，
    #    docs/sheet-module-ARCHITECTURE.md §11；新违规立即红）。零编译，秒级。──
    - name: lint (layer gate)
      script: bun script/ci.ts layer-gate

    # ── rust lint：fmt + clippy 硬门禁。两个 workspace 各跑一遍（见文件头）。
    #    基线已在 rustc 1.99.1（与镜像同版）本地清空，所以直接用 -D warnings：
    #    告警要么当场清掉，要么留在代码里无人认领。──
    - name: lint (rust gate)
      script: bun script/ci.ts lint-rust

    # ── build：crate check + TSX typecheck（nsh check 是唯一的类型检查口）。
    #    malachite-bigint 分裂的自动重试在 script/ci.ts 的 build 里（见文件头）。──
    - name: build (nsh check)
      script: bun script/ci.ts build

    # ── test：cargo test（native + manox）+ TSX headless 测试。──
    - name: test (nsh test)
      script: bun script/ci.ts test

    # ── manox hermetic 门禁：两条都是 docs/plan.md §4 单列的必须项，带
    #    ZU_MANOX_GATE=1（细节在 script/ci.ts 的 manox）。──
    - name: test (manox gate)
      script: bun script/ci.ts manox

    # ── pi-harness 自检：版本台账守卫（src/version.ts = package.json pin）+ bun 测试。
    #    这里不跑 bun run build（编译目标 pin 了 bun-darwin-arm64）；本地
    #    `bun run gate` 的 harness stage 在 darwin-arm64 上补这一次编译。──
    - name: pi-harness
      script: bun script/ci.ts harness

    # ── 终端符合性（issue #46 阶段五）：esctest2 全量 + ucs-detect（无则提示并跳过）。
    #    report-only，永远不红——红与不红都不影响合并，数字只进本 stage 日志
    #    与 docs/evidence/。python3 由 toolchain stage 装。──
    - name: conformance (report-only)
      script: bun script/ci.ts conformance

# ── NPC 运行镜像：底座 = 云原生开发环境（.ide/Dockerfile，工具链与 CI 同源），
#    其上只叠 NPC 运行时 CLI（.ide/Dockerfile.npc）。产物供文件尾 $ 段的
#    NPC 事件流水线引用。`ifModify` 让它在镜像输入（两个 Dockerfile）或本文件
#    的构建命令变化时才重建，普通 push 不花钱。──
main:
  push:
    - ifModify:
        - .ide/Dockerfile
        - .ide/Dockerfile.npc
        - .cnb.yml
      services:
        - docker
      stages:
        - name: build npc image
          script: |
            docker build -t zu-dev-base -f .ide/Dockerfile .
            docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest -f .ide/Dockerfile.npc .
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest

# 手动远程门禁：只有推送到 ci/remote 才触发（需要时
# `git push origin HEAD:ci/remote`）。平时 push 与 PR 都不再花钱。
"ci/remote":
  push:
    - *check-and-test

# ── 云原生开发（点分支页「云原生开发」按钮）：用 .ide/Dockerfile 构建镜像，
#    把同一套工具链预装进开发环境，打开即可 bun run check / test。
$:
  vscode:
    - docker:
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: toolchain ready
          script: nsh --version && bun --version && cargo --version

  # ── 自定义 NPC（角色定义在 .cnb/settings.yml）：运行环境 = 本仓库开发环境镜像
  #    （bun/cargo/nsh 全套工具链），而非 cnbcool/default-npc 的裸环境。配置合并
  #    按事件独立进行，两个事件都必须覆盖，缺一个仍走系统默认；且要合入 main
  #    才生效（issue 事件跑默认分支，PR 事件跑目标分支）。──
  issue.comment@npc:
    - docker:
        image: ${CNB_DOCKER_REGISTRY}/${CNB_NPC_SLUG_LOWERCASE}:latest
        volumes:
          # 复用 CI 同款缓存卷；刻意不含 /root/.nsh——NPC 镜像已把 nsh 烤进该路径，
          # COW 卷会把它盖掉（见文件头「卷只能挂在镜像里本来是空的路径」）。
          - /usr/local/cargo/registry
          - /usr/local/cargo/git
          - /root/.bun/install/cache
          - ./app/target
          - ./native/target
          - /root/.cache/zu-ghostty
          - /root/.cache/steer-conformance
      stages:
        - name: npc go
          type: npc:go

  pull_request.comment@npc:
    - docker:
        image: ${CNB_DOCKER_REGISTRY}/${CNB_NPC_SLUG_LOWERCASE}:latest
        volumes:
          - /usr/local/cargo/registry
          - /usr/local/cargo/git
          - /root/.bun/install/cache
          - ./app/target
          - ./native/target
          - /root/.cache/zu-ghostty
          - /root/.cache/steer-conformance
      stages:
        - name: npc go
          type: npc:go
