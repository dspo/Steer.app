[package]
name = "zu-ghostty"
version = "0.1.0"
edition = "2024"
publish = false
description = "libghostty-vt behind a safe wrapper: the Spike terminal's emulation core"
links = "ghostty-vt"
build = "build.rs"

[lib]
name = "zu_ghostty"
path = "src/lib.rs"


[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGColorSpace", "CGBitmapContext", "CGContext", "CGDataProvider", "CGImage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }
