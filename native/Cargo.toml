[package]
name = "zu-app"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libc = "0.2"
# nsh 0.5.0 pinned to the `v0.5.0` tag commit (f4d68f7 = `nsh --version`).
# The app's TS side uses 0.5.0 APIs (`Notifications`, `nsh/updater`,
# `nsh/i18n`, `WindowModule.get`), so CI's NSH_VERSION must stay 0.5.0 too —
# the nsh CLI sees the git source, builds the generated hosts from the same
# checkout, and patches the registry so the app and the runner share one core.
nsh-core = { git = "https://github.com/longbridge/nsh.git", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }
nsh-base = { git = "https://github.com/longbridge/nsh.git", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1" }
portable-pty = "0.9.0"
zu-ghostty = { path = "ghostty" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }

unicode-segmentation = "1"
unicode-width = "0.2"

# The terminal's own AppKit view (`src/term_view`), a native component the
# generated hosts register: the backend at the same source as nsh-core, and
# the objc2 crates at the versions it links.
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh.git", rev = "f4d68f7f9f31eb7b3ecc8a4cbc31096d5c6238a1", default-features = false }
objc2 = "0.6.5"
dispatch2 = "0.3.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSAttributedString", "NSGeometry", "NSObjCRuntime", "NSRange", "NSString", "NSURL", "NSDictionary"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "objc2-core-graphics", "NSAccessibilityConstants", "NSAttributedString", "NSCursor", "NSDragging", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSTextInputClient", "NSTextInputContext", "NSTrackingArea", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFAttributedString", "CFCGTypes", "CFDictionary", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGColorSpace", "CGContext", "CGDataProvider", "CGFont", "CGImage", "CGPath"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CTFont", "CTFontDescriptor", "CTFontTraits", "CTLine", "CTRun", "CTStringAttributes"] }

[dev-dependencies]
# The browser capability check reads `nsh.json`; the app's Rust code does not.
[profile.dev.package.nsh-core]
opt-level = 2
